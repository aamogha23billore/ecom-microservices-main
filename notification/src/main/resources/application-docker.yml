spring:
  application:
    name: notification

  cloud:
    function:
      definition: orderCreated

    stream:
      function:
        definition: orderCreated
      bindings:
        orderCreated-in-0:
          destination: order.exchange
          group: notification-group
          content-type: application/json

      kafka:
        binder:
          brokers: kafka:29092

server:
  port: 8084

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:8761/eureka/
    register-with-eureka: true
    fetch-registry: true