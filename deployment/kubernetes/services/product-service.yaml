apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecom-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: dcode007/product-service
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://configserver:8888"

            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: POSTGRES_PASSWORD

            - name: RABBITMQ_HOST
              value: "rabbitmq"

            - name: RABBITMQ_PORT
              value: "5672"

            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: RABBITMQ_USERNAME

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: RABBITMQ_PASSWORD

            - name: RABBITMQ_VHOST
              value: "guest"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecom-platform
spec:
  selector:
    app: product-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
