apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecom-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: dcode007/order-service
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://configserver:8888"

            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: POSTGRES_PASSWORD

            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: STRIPE_SECRET_KEY

            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: STRIPE_WEBHOOK_SECRET

            - name: STRIPE_CURRENCY
              value: "inr"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecom-platform
spec:
  selector:
    app: order-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
