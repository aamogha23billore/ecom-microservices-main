apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecom-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: dcode007/notification-service
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://configserver:8888"

            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

