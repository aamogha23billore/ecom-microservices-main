apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecom-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: dcode007/notification-service
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://configserver:8888"

            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecom-platform
spec:
  selector:
    app: notification-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
