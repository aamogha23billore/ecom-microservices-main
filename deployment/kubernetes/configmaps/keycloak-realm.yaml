apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: ecom-platform
data:
  ecom-app-realm.json: |
    {
      "realm": "ecom-app",
      "enabled": true,
      "displayName": "E-Commerce Application",
    
      "clients": [
        {
          "id": "11111111-1111-1111-1111-111111111111",
          "clientId": "ecom-client",
          "name": "ecom-client",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "*"
          ],
          "webOrigins": [
            "*"
          ],
          "attributes": {
            "post.logout.redirect.uris": "+"
          }
        }
      ],
    
      "users": [
        {
          "username": "user",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "user",
              "temporary": false
            }
          ],
          "clientRoles": {
            "realm-management": [
              "view-users",
              "manage-users",
              "view-clients",
              "query-clients"
            ],
            "ecom-client": [
              "USER"
            ]
          }
        }
      ],
    
      "roles": {
        "clients": {
          "ecom-client": {
            "USER": {
              "description": "Standard e-commerce user role"
            }
          }
        }
      }
    }

