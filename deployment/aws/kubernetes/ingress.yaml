apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecom-api
  namespace: ecom-platform
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/success-codes: '200'
spec:
  ingressClassName: alb
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /api/cart
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /orders/webhook
            pathType: Exact
            backend:
              service:
                name: gateway
                port:
                  number: 8080
