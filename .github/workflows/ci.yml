name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, user, product, order, notification, configserver, eureka]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml
      # Existing context-load tests depend on external infrastructure.
      # Compile test sources, but do not claim integration tests have run.
      - name: Compile and package
        run: mvn -B -ntp -f backend/${{ matrix.service }}/pom.xml -DskipTests package
      - name: Build container image
        run: docker build -t ecom/${{ matrix.service }}:ci backend/${{ matrix.service }}

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0
      - name: Render base and AWS overlay
        run: |
          kubectl kustomize deployment/kubernetes > /tmp/ecom-base.yaml
          kubectl kustomize deployment/aws/kubernetes > /tmp/ecom-aws.yaml
          test -s /tmp/ecom-base.yaml
          test -s /tmp/ecom-aws.yaml

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deployment/aws/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
